# Dependabot configuration for version updates.
# Docs:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  # 📦 NuGet packages (.csproj)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    labels:
      - "📦 dependencies"
      - "🔷 nuget"
    commit-message:
      prefix: "📦 chore(deps)"
      prefix-development: "🛠️ chore(deps-dev)"
      include: "scope"
    groups:
      microsoft-aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"
        update-types:
          - "minor"
          - "patch"
      nuget-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 🤖 GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    labels:
      - "📦 dependencies"
      - "🤖 github-actions"
    commit-message:
      prefix: "🤖 ci(deps)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # 🐳 Dev container image and features
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    labels:
      - "📦 dependencies"
      - "🐳 devcontainer"
    commit-message:
      prefix: "🐳 chore(devcontainer)"
      include: "scope"
    groups:
      devcontainers:
        patterns:
          - "*"
